name: Photo2Craft checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r apps/api/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: apps/api
      - run: npm ci && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
  mod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: bash gradlew --no-daemon build
        working-directory: minecraft/mod
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx==0.28.1
      - run: docker compose up -d --build --wait --wait-timeout 120
        env:
          AI_PROVIDER: disabled
          WEB_PORT: '8081'
      - run: python scripts/smoke_api.py --url http://127.0.0.1:8081 --image apps/web/e2e/reference.png --mode procedural
      - if: always()
        run: docker compose logs --no-color && docker compose down
