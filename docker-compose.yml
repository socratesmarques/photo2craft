services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        INSTALL_DEPTH: ${INSTALL_DEPTH:-false}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      DATA_DIR: /srv/photo2craft/data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5242880}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-8388608}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-16000000}
      MAX_BLOCKS: ${MAX_BLOCKS:-50000}
      MAX_DIMENSION: ${MAX_DIMENSION:-64}
      MAX_PROJECTS: ${MAX_PROJECTS:-200}
      DATABASE_URL: ${DATABASE_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FREE_TIER_CONFIRMED: ${GEMINI_FREE_TIER_CONFIRMED:-false}
      FALLBACK_PROVIDER: ${FALLBACK_PROVIDER:-none}
      GENERATION_MODE: ${GENERATION_MODE:-architectural}
      ENABLE_VISUAL_REFINEMENT: ${ENABLE_VISUAL_REFINEMENT:-true}
      MAX_REFINEMENT_PASSES: ${MAX_REFINEMENT_PASSES:-2}
      ENABLE_GENERATION_CACHE: ${ENABLE_GENERATION_CACHE:-true}
      MAX_REFERENCE_IMAGES: ${MAX_REFERENCE_IMAGES:-4}
      AI_DAILY_CALL_LIMIT: ${AI_DAILY_CALL_LIMIT:-20}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:8b}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-600}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-16000}
      VISUAL_DEBUG: ${VISUAL_DEBUG:-false}
      DEPTH_MODEL_PATH: ${DEPTH_MODEL_PATH:-}
      DEPTH_TIMEOUT_SECONDS: ${DEPTH_TIMEOUT_SECONDS:-45}
      AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-16384}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - photo2craft-data:/srv/photo2craft/data
      - ./models:/srv/photo2craft/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  photo2craft-data:
